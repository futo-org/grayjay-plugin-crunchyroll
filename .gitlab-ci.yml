stages:
  - deploy

variables:
  PLUGIN_NAME: Crunchyroll
  ICON_FILE: CrunchyrollIcon.png
  SCRIPT_FILE: CrunchyrollScript.js
  CONFIG_FILE: CrunchyrollConfig.json

deploy-master:
  stage: deploy
  variables:
    PRE_RELEASE: "false"
  script:
    - sh deploy.sh
  only:
    - master

deploy-dev:
  stage: deploy
  variables:
    PRE_RELEASE: "true"
  script:
    - sh deploy.sh
  only:
    - dev
